<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="application-name" content="APP Music" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APP Music" />
    <title>APP Music</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--initial-page-background, #0b0e15);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
      }

      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--initial-page-background, #0b0e15);
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      #boot-loading.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader {
        width: 60px;
        height: 20px;
        display: grid;
        color: var(--dominant-color, #ff6b6b);
      }

      .loader::before,
      .loader::after {
        content: '';
        grid-area: 1/1;
        --c: #0000 calc(100% / 3), var(--dominant-color, #ff6b6b) 0 calc(2 * 100% / 3), #0000 0;
        --c1: linear-gradient(90deg, var(--c));
        --c2: linear-gradient(0deg, var(--c));
        background: var(--c1), var(--c2), var(--c1), var(--c2);
        background-size: 300% 4px, 4px 300%;
        background-repeat: no-repeat;
        animation: l15 1.5s infinite;
      }

      .loader::after {
        animation-delay: -0.75s;
      }

      @keyframes l15 {
        0% {
          background-position: 50% 0, 100% 100%, 0 100%, 0 0;
        }
        25% {
          background-position: 0 0, 100% 50%, 0 100%, 0 0;
        }
        50% {
          background-position: 0 0, 100% 0, 50% 100%, 0 0;
        }
        75% {
          background-position: 0 0, 100% 0, 100% 100%, 0 50%;
        }
        75.01% {
          background-position: 100% 0, 100% 0, 100% 100%, 0 50%;
        }
        100% {
          background-position: 50% 0, 100% 0, 100% 100%, 0 100%;
        }
      }
    </style>
    <script>
      ;(function () {
        try {
          var session = JSON.parse(localStorage.getItem('xf-player-session-v1') || 'null')
          var savedTheme = localStorage.getItem('xf-theme')
          var path = location.pathname
          var isPlayPage = path === '/' || path === '/play'
          var themeBackground = savedTheme === 'light' ? '#f7f7fb' : '#0b0e15'
          var root = document.documentElement

          if (savedTheme === 'light') {
            root.setAttribute('data-theme', 'light')
          } else {
            root.removeAttribute('data-theme')
          }
          root.setAttribute('data-page', isPlayPage ? 'play' : 'theme')

          // 不再写入 theme-color。网页与 PWA 的系统栏直接透出页面本身，
          // 避免原生纯色与页面渐变之间产生色差或延迟切换。
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.remove()
          })

          var initialBackground = themeBackground
          var color = session && typeof session.dominantColor === 'string' ? session.dominantColor : '#ff6b6b'

          function parseColor(value) {
            if (value.charAt(0) === '#') {
              var hex = value.slice(1)
              if (hex.length === 3) hex = hex.replace(/./g, function (part) { return part + part })
              if (!/^[0-9a-f]{6}$/i.test(hex)) return null
              return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)]
            }
            var channels = value.match(/\d+(?:\.\d+)?/g)
            return channels && channels.length >= 3 ? channels.slice(0, 3).map(Number) : null
          }

          function mix(source, target, weight) {
            return 'rgb(' + source.map(function (channel, index) {
              return Math.round(channel * (1 - weight) + target[index] * weight)
            }).join(', ') + ')'
          }

          var rgb = parseColor(color)
          if (isPlayPage && rgb) {
            var luminance = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255
            var isLightColor = luminance > 0.65
            var start = mix(rgb, isLightColor ? [255, 247, 239] : [26, 26, 46], isLightColor ? 0.82 : 0.08)
            var mid = mix(rgb, isLightColor ? [244, 247, 251] : [20, 20, 40], isLightColor ? 0.9 : 0.18)
            var immersiveBackground = 'linear-gradient(180deg, ' + start + ' 0%, ' + mid + ' 50%, ' + start + ' 100%)'

            root.style.setProperty('--dominant-color', color)
            root.style.setProperty('--dominant-bg-start', start)
            root.style.setProperty('--dominant-bg-mid', mid)
            root.style.setProperty('--dominant-bg-end', start)
            root.style.setProperty('--immersive-bg', immersiveBackground)
            initialBackground = immersiveBackground
          }

          root.style.setProperty('--initial-page-background', initialBackground)
        } catch (_) {
          // 首次打开或旧缓存损坏时使用默认沉浸色。
        }
      })()
    </script>
  </head>
  <body>
    <div id="boot-loading" role="status" aria-label="正在加载页面">
      <div class="loader" aria-hidden="true"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
